<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vuelva Pronto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: #FFB0B0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            background-color: white;
            width: 90%;
            max-width: 700px;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .contenedor h1 {
            color: #333;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .contenedor p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .imagen-web {
            width: 400px;
            max-width: 100%;
            border-radius: 15px;
        }

        .imagen-boton {
            width: 120px;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .imagen-boton:hover {
            transform: scale(1.05);
        }

    </style>

</head>


<body>

    <div class="contenedor">

        <h1>Vuelva Pronto</h1>

        <p>
            Esta sección se encuentra en construcción.
            Gracias por visitar nuestro sitio web.
        </p>

        <img src="imagenes/web.jpg"
             class="imagen-web"
             alt="Diseño web">

        <p class="mt-4">
            Si deseas conocer más información sobre
            el curso de diseño web, haz clic en la
            siguiente imagen.
        </p>


        <!-- MÁS INFORMACIÓN -->

        <a href="inicio.html">

            <img src="imagenes/masinformacion.jpg"
                 class="imagen-boton"
                 alt="Más información">

        </a>


        <br><br>


        <!-- VOLVER -->

        <a href="index.html"
           class="btn btn-dark">

            Volver al inicio

        </a>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
